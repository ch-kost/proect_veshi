{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#143c45">
    <meta name="description" content="Предметы, владельцы и история передачи вещей в одном реестре.">
    <title>{% block title %}Реестр вещей{% endblock %} · История владения</title>
    <link rel="icon" href="{% static 'homepage/img/logo.svg' %}" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
    <script src="{% static 'homepage/js/main.js' %}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Перейти к содержимому</a>
    {% include 'includes/navigation.html' %}
    <main id="main-content" class="site-main container" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <div class="container footer-inner">
        <div>
          <span class="footer-name">История владения</span>
          <p>Каждой вещи — понятная история.</p>
        </div>
        <p class="footer-note">
          Учебный проект Django · <span data-current-year>{% now 'Y' %}</span>
        </p>
      </div>
    </footer>
  </body>
</html>
